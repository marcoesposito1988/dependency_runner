[package]
name = "dependency_runner"
description = "ldd for Windows - and more!"
version = "1.6.0"
authors = ["Marco Esposito <esposito@imfusion.com>"]
edition = "2024"
license = "LGPL-3.0-only"
repository = "https://github.com/marcoesposito1988/dependency_runner/"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["dll"]
exclude = [
    "test_data/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
multimap = "0.10.1"
pelite = "0.10.0"
goblin = "0.10.7"
dataview = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
roxmltree = "0.21.2"
regex = "1.13.1"
msvc-demangler = "0.11.0"
fs-err = "3.3.2"
glob = "0.3.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
memmap2 = "0.9"
petgraph = "0.8.3"
crossbeam = "0.8.5"
skim = "5.9.0"
ratatui = "0.30.2"
tui-tree-widget = "0.24.1"
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }
